<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="vSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12181b" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
    <linearGradient id="vGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C98B" />
      <stop offset="100%" stop-color="#8c6e33" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#vSky)" />
  <!-- Villa Geometric Modernist Pavilion -->
  <!-- Upper Floating Floor -->
  <rect x="220" y="160" width="400" height="110" rx="4" fill="#181818" stroke="#2e2a22" stroke-width="2" />
  <!-- Glass Window Walls -->
  <rect x="240" y="175" width="170" height="80" fill="#FFE8B2" opacity="0.85" rx="2" />
  <rect x="430" y="175" width="170" height="80" fill="#E5C98B" opacity="0.75" rx="2" />
  <!-- Ground Floor Living Wing -->
  <rect x="160" y="270" width="480" height="130" fill="#141414" stroke="#252119" stroke-width="2" />
  <rect x="180" y="285" width="220" height="100" fill="#FFE8B2" opacity="0.9" rx="2" />
  <rect x="420" y="285" width="200" height="100" fill="#1c1c1c" />
  <!-- Stone Wall Texture Feature -->
  <line x1="420" y1="285" x2="420" y2="385" stroke="url(#vGold)" stroke-width="2" />
  <!-- Illuminated Infinity Pool & Reflection -->
  <polygon points="120,440 680,440 730,500 70,500" fill="#0077b6" opacity="0.4" />
  <line x1="120" y1="440" x2="680" y2="440" stroke="url(#vGold)" stroke-width="2" />
  <!-- Landscaped Cypress / Palm Silhouettes -->
  <polygon points="130,420 145,260 160,420" fill="#0c1a14" opacity="0.85" />
  <polygon points="660,420 675,280 690,420" fill="#0c1a14" opacity="0.85" />
</svg>

