<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="aSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191714" />
      <stop offset="100%" stop-color="#090807" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#aSky)" />
  <!-- Boutique Luxury Mid-Rise Architecture with Bronze Trim -->
  <rect x="200" y="100" width="400" height="400" fill="#131313" stroke="#C6A15B" stroke-width="2" />
  <!-- Grand Entrance Portico -->
  <rect x="340" y="420" width="120" height="80" fill="#222" stroke="#E5C98B" stroke-width="2" />
  <line x1="340" y1="415" x2="460" y2="415" stroke="#E5C98B" stroke-width="3" />
  <!-- Balconies with warm lighting -->
  <g fill="#FFE7B0" opacity="0.85">
    <rect x="230" y="130" width="150" height="60" rx="3" />
    <rect x="420" y="130" width="150" height="60" rx="3" fill="#E5C98B" />
    <rect x="230" y="220" width="150" height="60" rx="3" fill="#E5C98B" />
    <rect x="420" y="220" width="150" height="60" rx="3" />
    <rect x="230" y="310" width="150" height="60" rx="3" />
    <rect x="420" y="310" width="150" height="60" rx="3" fill="#FFE7B0" />
  </g>
  <!-- Architectural vertical louvres -->
  <line x1="398" y1="100" x2="398" y2="410" stroke="#C6A15B" stroke-width="3" />
  <line x1="402" y1="100" x2="402" y2="410" stroke="#8c6e33" stroke-width="2" />
</svg>

