<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a22" />
      <stop offset="100%" stop-color="#07090c" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c2833" />
      <stop offset="50%" stop-color="#2e4053" />
      <stop offset="100%" stop-color="#17202a" />
    </linearGradient>
    <linearGradient id="cGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D4" />
      <stop offset="100%" stop-color="#C6A15B" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#cSky)" />
  <!-- Surrounding City Buildings -->
  <rect x="80" y="240" width="120" height="260" fill="#0d1117" />
  <rect x="600" y="220" width="140" height="280" fill="#0d1117" />
  <!-- Main Grade-A Commercial Skyscraper -->
  <polygon points="260,500 290,60 510,60 540,500" fill="url(#glassGrad)" stroke="#3a4b5c" stroke-width="2" />
  <!-- Crown / Helipad / Spire -->
  <polygon points="290,60 400,20 510,60" fill="#111" stroke="url(#cGold)" stroke-width="2" />
  <circle cx="400" cy="20" r="3" fill="#E5C98B" />
  <!-- Vertical Curtain Glass Mullions & Gold LED Strips -->
  <line x1="330" y1="60" x2="310" y2="500" stroke="rgba(229, 201, 139, 0.4)" stroke-width="1.5" />
  <line x1="400" y1="20" x2="400" y2="500" stroke="url(#cGold)" stroke-width="2" />
  <line x1="470" y1="60" x2="490" y2="500" stroke="rgba(229, 201, 139, 0.4)" stroke-width="1.5" />
  <!-- Corporate Floor Plates Lit Up -->
  <g fill="#FFE9B8" opacity="0.8">
    <rect x="315" y="100" width="170" height="8" rx="1" />
    <rect x="310" y="140" width="180" height="8" rx="1" />
    <rect x="305" y="180" width="190" height="8" rx="1" />
    <rect x="300" y="220" width="200" height="8" rx="1" />
    <rect x="295" y="260" width="210" height="8" rx="1" fill="#E5C98B" />
    <rect x="290" y="300" width="220" height="8" rx="1" />
    <rect x="285" y="340" width="230" height="8" rx="1" />
    <rect x="280" y="380" width="240" height="8" rx="1" fill="#FFE9B8" />
    <rect x="275" y="420" width="250" height="8" rx="1" />
  </g>
</svg>

