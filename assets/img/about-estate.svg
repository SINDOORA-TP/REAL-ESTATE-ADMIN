<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="aboutGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#221e16" />
      <stop offset="100%" stop-color="#090807" />
    </radialGradient>
    <linearGradient id="abGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D4" />
      <stop offset="50%" stop-color="#E5C98B" />
      <stop offset="100%" stop-color="#C6A15B" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#aboutGrad)" />
  <circle cx="400" cy="300" r="240" fill="none" stroke="url(#abGold)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
  <circle cx="400" cy="300" r="180" fill="none" stroke="url(#abGold)" stroke-width="1" opacity="0.4" />
  <!-- Architectural blueprint grid -->
  <g stroke="rgba(198,161,91,0.15)" stroke-width="1">
    <line x1="200" y1="100" x2="200" y2="500" />
    <line x1="300" y1="100" x2="300" y2="500" />
    <line x1="400" y1="100" x2="400" y2="500" />
    <line x1="500" y1="100" x2="500" y2="500" />
    <line x1="600" y1="100" x2="600" y2="500" />
    <line x1="100" y1="200" x2="700" y2="200" />
    <line x1="100" y1="300" x2="700" y2="300" />
    <line x1="100" y1="400" x2="700" y2="400" />
  </g>
  <!-- Architectural Monogram & Facade Structure -->
  <polygon points="400,160 520,240 520,440 280,440 280,240" fill="#141414" stroke="url(#abGold)" stroke-width="2.5" />
  <polygon points="400,190 490,250 490,410 310,410 310,250" fill="none" stroke="rgba(229,201,139,0.3)" stroke-width="1" />
  <path d="M340,380 L340,290 L400,340 L460,290 L460,380" fill="none" stroke="url(#abGold)" stroke-width="3" stroke-linecap="round" />
</svg>

