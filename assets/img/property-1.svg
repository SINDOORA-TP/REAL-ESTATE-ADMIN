<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="p1Sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191512" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="p1Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C98B" />
      <stop offset="100%" stop-color="#9B783E" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#p1Sky)" />
  <!-- Skyline back -->
  <rect x="50" y="220" width="80" height="280" fill="#111" />
  <rect x="150" y="160" width="120" height="340" fill="#141414" />
  <rect x="620" y="190" width="110" height="310" fill="#121212" />
  <!-- Penthouse Main Tower Structure -->
  <polygon points="300,500 300,90 560,90 560,500" fill="#161616" stroke="#252119" stroke-width="2" />
  <!-- Top Penthouse Deck & Infinity Pool -->
  <rect x="315" y="105" width="230" height="60" fill="#0d1f2d" opacity="0.8" stroke="url(#p1Gold)" stroke-width="1.5" />
  <!-- Warm Illuminated Glass Windows -->
  <g fill="#FFE5A3" opacity="0.85">
    <rect x="325" y="180" width="45" height="28" rx="2" />
    <rect x="385" y="180" width="60" height="28" rx="2" fill="#E5C98B" />
    <rect x="460" y="180" width="45" height="28" rx="2" />
    <rect x="325" y="230" width="180" height="32" rx="2" fill="#E5C98B" opacity="0.7" />
    <rect x="325" y="285" width="50" height="30" rx="2" />
    <rect x="390" y="285" width="115" height="30" rx="2" fill="#FFE5A3" />
    <rect x="325" y="340" width="180" height="30" rx="2" fill="#C6A15B" opacity="0.6" />
    <rect x="325" y="395" width="80" height="30" rx="2" />
    <rect x="420" y="395" width="85" height="30" rx="2" fill="#FFE5A3" />
  </g>
  <!-- Architectural Cantilever Balcony -->
  <polygon points="260,250 340,250 330,270 270,270" fill="url(#p1Gold)" opacity="0.9" />
  <!-- Water Reflection / Pool Edge -->
  <rect x="340" y="145" width="180" height="15" fill="#48cae4" opacity="0.85" />
</svg>

