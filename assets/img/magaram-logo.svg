<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D4" />
      <stop offset="50%" stop-color="#E5C98B" />
      <stop offset="100%" stop-color="#C6A15B" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Diamond / Royal Emblem -->
  <polygon points="60,6 114,60 60,114 6,60" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  <polygon points="60,14 106,60 60,106 14,60" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.4" />
  
  <!-- Architectural Crown / Chevron -->
  <path d="M42 42 L60 25 L78 42" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Stylized Royal 'M' Architecture -->
  <path d="M38 78 L38 46 L60 68 L82 46 L82 78" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)" />
  
  <!-- Foundation Bar -->
  <line x1="34" y1="86" x2="86" y2="86" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="60" cy="94" r="2.5" fill="url(#goldGrad)" />
</svg>

